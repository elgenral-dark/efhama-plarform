<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">أجزاء الدالة وعلاقاتها</title>
  <desc id="desc">المعاملات والمدخلات تصل إلى جسم الدالة الذي يعيد قيمة إلى مكان الاستدعاء.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12z" fill="#3C4AE8"/></marker>
  </defs>
  <rect width="1000" height="500" rx="28" fill="#fff"/>
  <text x="500" y="52" fill="#172033" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle">العلاقة بين الاستدعاء وأجزاء الدالة</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="60" y="155" width="230" height="145" rx="20" fill="#eef0ff" stroke="#3C4AE8" stroke-width="4"/>
    <text x="175" y="205" fill="#3C4AE8" font-size="25" font-weight="700">استدعاء الدالة</text>
    <text x="175" y="252" fill="#27324a" font-family="monospace" font-size="22">add(10, 20)</text>
    <rect x="385" y="155" width="230" height="145" rx="20" fill="#f5f7ff" stroke="#7d87ee" stroke-width="4"/>
    <text x="500" y="205" fill="#3C4AE8" font-size="25" font-weight="700">Parameters</text>
    <text x="500" y="252" fill="#27324a" font-family="monospace" font-size="22">a = 10, b = 20</text>
    <rect x="710" y="155" width="230" height="145" rx="20" fill="#eef0ff" stroke="#3C4AE8" stroke-width="4"/>
    <text x="825" y="205" fill="#3C4AE8" font-size="25" font-weight="700">جسم الدالة</text>
    <text x="825" y="252" fill="#27324a" font-family="monospace" font-size="22">return a + b</text>
    <path d="M295 225h75M620 225h75" fill="none" stroke="#3C4AE8" stroke-width="6" marker-end="url(#arrow)"/>
    <path d="M825 315v85H175v-85" fill="none" stroke="#20b26b" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="350" y="365" width="300" height="75" rx="18" fill="#edfff5" stroke="#20b26b" stroke-width="3"/>
    <text x="500" y="412" fill="#16784b" font-size="24" font-weight="700">القيمة الراجعة = 30</text>
  </g>
</svg>
