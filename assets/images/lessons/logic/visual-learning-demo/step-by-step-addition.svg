<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">خطوات جمع رقمين باستخدام دالة</title>
  <desc id="desc">أربع خطوات: استدعاء الدالة، تمرير الرقمين، تنفيذ عملية الجمع، ثم استخدام الناتج.</desc>
  <rect width="1000" height="400" rx="28" fill="#fff"/>
  <text x="500" y="54" fill="#172033" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle">من استدعاء الدالة إلى استخدام الناتج</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g>
      <rect x="45" y="120" width="205" height="190" rx="20" fill="#eef0ff" stroke="#3C4AE8" stroke-width="3"/>
      <circle cx="148" cy="158" r="22" fill="#3C4AE8"/><text x="148" y="166" fill="#fff" font-size="21" font-weight="700">1</text>
      <text x="148" y="215" fill="#27324a" font-size="23" font-weight="700">استدعِ الدالة</text><text x="148" y="260" fill="#3C4AE8" font-family="monospace" font-size="20">add(4, 5)</text>
    </g>
    <g>
      <rect x="285" y="120" width="205" height="190" rx="20" fill="#f7f8ff" stroke="#7580ed" stroke-width="3"/>
      <circle cx="388" cy="158" r="22" fill="#3C4AE8"/><text x="388" y="166" fill="#fff" font-size="21" font-weight="700">2</text>
      <text x="388" y="215" fill="#27324a" font-size="23" font-weight="700">مرّر القيم</text><text x="388" y="260" fill="#3C4AE8" font-family="monospace" font-size="20">a=4, b=5</text>
    </g>
    <g>
      <rect x="525" y="120" width="205" height="190" rx="20" fill="#eef0ff" stroke="#3C4AE8" stroke-width="3"/>
      <circle cx="628" cy="158" r="22" fill="#3C4AE8"/><text x="628" y="166" fill="#fff" font-size="21" font-weight="700">3</text>
      <text x="628" y="215" fill="#27324a" font-size="23" font-weight="700">نفّذ العملية</text><text x="628" y="260" fill="#3C4AE8" font-family="monospace" font-size="20">4 + 5 = 9</text>
    </g>
    <g>
      <rect x="765" y="120" width="190" height="190" rx="20" fill="#edfff5" stroke="#20b26b" stroke-width="3"/>
      <circle cx="860" cy="158" r="22" fill="#20b26b"/><text x="860" y="166" fill="#fff" font-size="21" font-weight="700">4</text>
      <text x="860" y="215" fill="#27324a" font-size="23" font-weight="700">استخدم الناتج</text><text x="860" y="260" fill="#16784b" font-family="monospace" font-size="20">result = 9</text>
    </g>
    <path d="M254 214h24M494 214h24M734 214h24" stroke="#3C4AE8" stroke-width="5"/>
    <path d="m270 204 12 10-12 10m228-10 12 10-12 10m228-10 12 10-12 10" fill="none" stroke="#3C4AE8" stroke-width="4"/>
  </g>
</svg>
