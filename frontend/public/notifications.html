    </div>
  </header>
  <main id="main" class="container notification-page">
    <div class="notification-page-heading">
      <div><p class="notification-eyebrow">مركز التنبيهات</p><h1>إشعاراتك</h1></div>
      <div class="notification-page-actions">
        <button class="btn btn-outline btn-sm" id="markAllRead" type="button">تحديد الكل كمقروء</button>
        <button class="btn btn-ghost btn-sm" id="clearAll" type="button">حذف الكل</button>
      </div>
    </div>
    <form class="notification-filters" id="notificationFilters">
      <label>الحالة
        <select id="readFilter">
          <option value="">الكل</option><option value="false">غير مقروء</option><option value="true">مقروء</option>
        </select>
      </label>
      <label>التصنيف
        <select id="categoryFilter">
          <option value="">كل التصنيفات</option>
          <option value="general">عام</option><option value="course">دورة</option>
          <option value="lesson">درس</option><option value="exam">اختبار</option>
          <option value="assignment">واجب</option><option value="grade">درجة</option>
          <option value="subscription">اشتراك</option><option value="payment">دفع</option>
          <option value="account">حساب</option><option value="system">النظام</option>
          <option value="teacher">المعلم</option><option value="admin">الإدارة</option>
        </select>
      </label>
      <label class="notification-search">بحث
        <input id="notificationSearch" type="search" maxlength="100" placeholder="ابحث في العنوان أو الرسالة">
      </label>
    </form>
    <p id="notificationStatus" class="notification-page-status" role="status" aria-live="polite"></p>
    <div id="notificationList" class="notification-list" aria-live="polite"></div>
    <div id="notificationEmpty" class="notification-empty" hidden>
      <span class="notification-empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></span>
      <h2>لا توجد إشعارات</h2><p>ستظهر هنا تحديثات حسابك وأنشطتك التعليمية.</p>
    </div>
    <div id="notificationError" class="notification-error" hidden role="alert">
      <p>تعذر تحميل الإشعارات. تحقق من اتصالك وحاول مجددًا.</p>
      <button class="btn btn-outline btn-sm" id="retryNotifications" type="button">إعادة المحاولة</button>
    </div>
    <nav class="notification-pagination" aria-label="صفحات الإشعارات">
      <button class="btn btn-ghost btn-sm" id="previousNotifications" type="button" disabled>السابق</button>
      <span id="notificationPageInfo" class="muted small"></span>
      <button class="btn btn-ghost btn-sm" id="nextNotifications" type="button" disabled>التالي</button>
    </nav>
  </main>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/notifications-page.js"></script>
</body>
</html>
